/* ============ THEME ============ */
:root{
  --profileBackground:#003719;
  --button-style-background:#006724;
  --button-style-background-hover:#00782b;
  --button-style-text:#ffffff;
  --button-style-radius:28px;
  --header-text-color:#d9ff00;
  --header-font-family:'Salsa BT',cursive;
  --header-font-weight:400;
  --bodyText:#ffffff;
  --linkHeaderFontSize:14px;
  --link-gap:14px;
  --profile-container-desktop-width:580px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip;}
html,body{margin:0;padding:0;}
body{background:#003719;color:#fff;font-family:'DM Sans','Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:inherit;}
.font-product{font-family:'Link Sans Product',sans-serif;}

/* ============ PAGE FRAME ============ */
.frame{position:relative;min-height:100lvh;display:flex;flex-direction:column;justify-content:space-between;}
.backdrop{display:none;}
.pagebg{position:fixed;inset:0;z-index:-1;margin:0 auto;max-width:var(--profile-container-desktop-width);background-color:#003719;}
@media screen and (min-width:576px){
  .frame{margin-top:2.5rem;min-height:calc(100lvh - 2.5rem);}
  .backdrop{display:block;position:fixed;inset:0;z-index:-2;background-color:color-mix(in srgb,#003719 88%,white 12%);}
  .backdrop::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.2);}
  .pagebg{clip-path:inset(0px calc(50% - min(50%, 290px)) 0px calc(50% - min(50%, 290px)) round 24px 24px 0 0);}
}
.inner{max-width:var(--profile-container-desktop-width);margin:0 auto;width:100%;}

/* ============ HEADER (ZayDante-style hero) ============ */
#avatar-hero{height:calc(100vw - 80px);position:relative;will-change:opacity,transform;}
@media screen and (min-width:576px){#avatar-hero{height:calc(var(--profile-container-desktop-width) - 80px);}}
.avatar-bg{position:absolute;left:0;right:0;top:0;z-index:-1;width:100vw;height:100vw;background-color:var(--profileBackground);
  -webkit-mask-image:radial-gradient(110.26% 96% at 50% 0%,#000 50%,rgba(0,0,0,0.99) 54.68%,rgba(0,0,0,0.97) 58.79%,rgba(0,0,0,0.94) 62.4%,rgba(0,0,0,0.90) 65.61%,rgba(0,0,0,0.85) 68.52%,rgba(0,0,0,0.79) 71.2%,rgba(0,0,0,0.72) 73.75%,rgba(0,0,0,0.65) 76.25%,rgba(0,0,0,0.57) 78.8%,rgba(0,0,0,0.48) 81.48%,rgba(0,0,0,0.39) 84.39%,rgba(0,0,0,0.30) 87.6%,rgba(0,0,0,0.20) 91.21%,rgba(0,0,0,0.10) 95.32%,rgba(0,0,0,0.00) 100%);
  mask-image:radial-gradient(110.26% 96% at 50% 0%,#000 50%,rgba(0,0,0,0.99) 54.68%,rgba(0,0,0,0.97) 58.79%,rgba(0,0,0,0.94) 62.4%,rgba(0,0,0,0.90) 65.61%,rgba(0,0,0,0.85) 68.52%,rgba(0,0,0,0.79) 71.2%,rgba(0,0,0,0.72) 73.75%,rgba(0,0,0,0.65) 76.25%,rgba(0,0,0,0.57) 78.8%,rgba(0,0,0,0.48) 81.48%,rgba(0,0,0,0.39) 84.39%,rgba(0,0,0,0.30) 87.6%,rgba(0,0,0,0.20) 91.21%,rgba(0,0,0,0.10) 95.32%,rgba(0,0,0,0.00) 100%);}
@media screen and (min-width:576px){
  .avatar-bg{width:var(--profile-container-desktop-width);height:var(--profile-container-desktop-width);overflow:hidden;border-radius:8px 8px 0 0;}
}
.avatar-bg img.sharp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:heroZoom 10s cubic-bezier(.22,1,.36,1) both;}
@keyframes heroZoom{from{transform:scale(1.09);}to{transform:scale(1);}}
body.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1);will-change:opacity,transform;}
body.js .reveal.in{opacity:1;transform:none;}
.avatar-bg .blur-layer{position:absolute;inset:0;width:100%;height:100%;
  -webkit-mask-image:radial-gradient(110.26% 96% at 50% 0%,rgba(0,0,0,0.00) 60%,rgba(0,0,0,0.01) 64.72%,rgba(0,0,0,0.03) 68.55%,rgba(0,0,0,0.07) 71.65%,rgba(0,0,0,0.12) 74.13%,rgba(0,0,0,0.18) 76.15%,rgba(0,0,0,0.25) 77.82%,rgba(0,0,0,0.33) 79.3%,rgba(0,0,0,0.41) 80.7%,rgba(0,0,0,0.50) 82.18%,rgba(0,0,0,0.59) 83.85%,rgba(0,0,0,0.67) 85.87%,rgba(0,0,0,0.76) 88.35%,rgba(0,0,0,0.85) 91.45%,rgba(0,0,0,0.93) 95.28%,#000 100%);
  mask-image:radial-gradient(110.26% 96% at 50% 0%,rgba(0,0,0,0.00) 60%,rgba(0,0,0,0.01) 64.72%,rgba(0,0,0,0.03) 68.55%,rgba(0,0,0,0.07) 71.65%,rgba(0,0,0,0.12) 74.13%,rgba(0,0,0,0.18) 76.15%,rgba(0,0,0,0.25) 77.82%,rgba(0,0,0,0.33) 79.3%,rgba(0,0,0,0.41) 80.7%,rgba(0,0,0,0.50) 82.18%,rgba(0,0,0,0.59) 83.85%,rgba(0,0,0,0.67) 85.87%,rgba(0,0,0,0.76) 88.35%,rgba(0,0,0,0.85) 91.45%,rgba(0,0,0,0.93) 95.28%,#000 100%);}
.avatar-bg .blur-layer img{width:100%;height:100%;object-fit:cover;}

/* scroll fade (like original hero) */
@keyframes hfOut{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(100px) scale(1.01);}}
@keyframes hfIn{0%{transform:translateY(0) scale(1);}100%{transform:translateY(-50px) scale(1.1);}}
@supports (animation-timeline:scroll()){
  #avatar-hero{animation:hfOut ease-out forwards;animation-timeline:scroll(root);animation-range:40px min(50vh,var(--profile-container-desktop-width));}
  #avatar-hero .blur-layer{animation:hfIn ease-out forwards;animation-timeline:scroll(root);animation-range:40px calc(var(--profile-container-desktop-width) * 1.5);}
}

.header-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:4px;}
.title-area{margin:0 24px;max-width:calc(100% - 48px);text-align:center;font-size:16px;line-height:16px;}
h1.profile-title{margin:0;display:inline;font-family:var(--header-font-family);font-weight:var(--header-font-weight);color:var(--header-text-color);font-size:clamp(2rem,5vw + 0.9rem,3rem);line-height:1.2;overflow-wrap:break-word;text-wrap:balance;}
.description{margin-top:4px;padding:0 42px;text-align:center;width:fit-content;}
.description h2{margin:0;font-family:'DM Sans',sans-serif;font-weight:500;font-size:16px;line-height:24px;color:#fff;text-align:center;text-wrap:balance;}

/* ============ LINKS ============ */
.content{position:relative;z-index:1;overflow-x:clip;overflow-y:visible;padding:2rem var(--link-gap) 16px;}
@media screen and (min-width:576px){.content{padding:2rem calc(var(--link-gap)*2) 16px;}}
.links{display:flex;flex-direction:column;gap:var(--link-gap);}
.collection{display:flex;flex-direction:column;gap:var(--link-gap);}
.collection.pt{padding-top:var(--link-gap);}
.group-title{margin:0;text-align:center;font-size:var(--linkHeaderFontSize);font-weight:700;line-height:1.5;color:var(--bodyText);}
@media screen and (min-width:576px){.group-title{font-size:16px;}}

/* ============ CARD BUTTONS ============ */
.card{position:relative;}
.card-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;padding:16px 44px;border-radius:9999px;background:var(--button-style-background);color:var(--button-style-text);border:0;cursor:pointer;font-family:'Link Sans Product',sans-serif;font-size:14px;font-weight:500;letter-spacing:-0.2px;line-height:1.2;text-decoration:none;transition:background-color .22s ease,transform .28s cubic-bezier(.22,1,.36,1),box-shadow .3s ease;}
.card-btn:hover{background:var(--button-style-background-hover);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.28);}
.card-btn:active{transform:translateY(-1px) scale(.98);box-shadow:0 4px 12px rgba(0,0,0,.22);}
.card-btn .label{text-align:center;}
.card-btn .chev{flex-shrink:0;color:rgba(255,255,255,0.85);transition:transform .3s cubic-bezier(.22,1,.36,1);}
a.card-btn{text-decoration:none;}
.card-btn .bicon{width:20px;height:20px;flex-shrink:0;display:block;transition:transform .28s cubic-bezier(.22,1,.36,1);}
.card-btn:hover .bicon{transform:scale(1.12);}
.card.open .chev{transform:rotate(180deg);}

/* panel reveal: smooth height + fade */
.panel{display:grid;grid-template-rows:0fr;margin-top:0;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.10);opacity:0;visibility:hidden;transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1),opacity .35s ease,visibility .45s,margin-top .45s cubic-bezier(.22,1,.36,1);}
.card.open .panel{grid-template-rows:1fr;opacity:1;visibility:visible;margin-top:10px;}
.panel-inner{overflow:hidden;min-height:0;}
.panel-pad{padding:14px 16px;}
.panel-item + .panel-item{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);}
.panel-tag{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.55);font-family:'Link Sans Product',sans-serif;}
.panel-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.panel-val{flex:1;min-width:0;font-family:'Link Sans Product',sans-serif;font-size:14px;line-height:1.4;color:var(--header-text-color);overflow-wrap:anywhere;word-break:break-all;}
a.panel-val{color:#fff;text-decoration:none;}
a.panel-val:hover{text-decoration:underline;color:var(--header-text-color);}
.panel-btns{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}
.go-btn,.copy-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:9999px;font-family:'Link Sans Product',sans-serif;font-size:13px;font-weight:600;letter-spacing:-0.2px;cursor:pointer;transition:transform .22s cubic-bezier(.22,1,.36,1),background-color .25s ease,border-color .25s ease,color .25s ease;}
.go-btn{background:var(--header-text-color);color:#003719;border:0;text-decoration:none;}
.copy-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);}
.go-btn:active,.copy-btn:active{transform:scale(0.94);}
.copy-btn svg{display:block;}
.copy-btn.done{background:var(--header-text-color);border-color:var(--header-text-color);color:#003719;}

/* ============ FOOTER ============ */
.footer{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:48px 16px 64px;color:rgba(255,255,255,0.55);font-family:'Link Sans Product',sans-serif;font-size:12px;line-height:18px;text-align:center;}
</style>

<script>
  /* JS scroll-fade fallback for browsers without scroll-driven animations */
  (function(){
    if (!(CSS.supports && CSS.supports('animation-timeline','scroll()'))) {
      var av = document.getElementById('avatar-hero');
      if (av) {
        function onScroll(){
          var y = window.scrollY || 0;
          var p = Math.min(1, Math.max(0, (y - 40) / 460));
          av.style.opacity = String(1 - p);
          av.style.transform = 'translateY(' + (100*p).toFixed(1) + 'px) scale(' + (1 + 0.01*p).toFixed(4) + ')';
        }
        window.addEventListener('scroll', onScroll, {passive:true});
        onScroll();
      }
    }
  })();

  /* Smooth reveal on load & scroll (staggered fade-up) */
  document.body.classList.add('js');
  (function(){
    var rev = document.querySelectorAll('.reveal');
    var i = 0;
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting) {
            en.target.classList.add('in');
            io.unobserve(en.target);
          }
        });
      }, {threshold: 0.12, rootMargin: '0px 0px -30px 0px'});
      rev.forEach(function(el){
        el.style.transitionDelay = Math.min(i * 70, 420) + 'ms';
        i++;
        io.observe(el);
      });
    } else {
      rev.forEach(function(el){ el.classList.add('in'); });
    }
  })();

  /* Accordion: click card -> reveal panel below, close others */
  document.querySelectorAll('.card').forEach(function(card){
    var btn = card.querySelector('.card-btn');
    btn.addEventListener('click', function(){
      var wasOpen = card.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(function(c){ c.classList.remove('open'); c.querySelector('.card-btn').setAttribute('aria-expanded','false'); });
      if(!wasOpen){
        card.classList.add('open');
        btn.setAttribute('aria-expanded','true');
      }
    });
  });

  /* Copy buttons */
  function copyText(v){
    var fallback = function(){
      var ta = document.createElement('textarea');
      ta.value = v;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    };
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(v).catch(function(){ fallback(); });
    }
    fallback();
    return Promise.resolve();
  }
  document.querySelectorAll('.copy-btn').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var txt = b.querySelector('.copy-txt');
      copyText(b.getAttribute('data-copy')).then(function(){
        b.classList.add('done');
        txt.textContent = 'Tersalin ✓';
        setTimeout(function(){
          b.classList.remove('done');
          txt.textContent = 'Salin';
        }, 1500);
      });
    });
  });
</script>
