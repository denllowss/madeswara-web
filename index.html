<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; user-drag: none; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", Helvetica, Arial, system-ui, -apple-system, sans-serif;
    color: #fff;
    background-color: #000;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://assets.production.linktr.ee/profiles/_next/static/media/video-frame-desktop.f2c8f96488cada9c.webp");
    background-size: cover;
    background-position: center;
    z-index: -3;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 100%);
    z-index: -1;
  }
  @media (max-width: 600px) {
    body::before { background-image: url("https://assets.production.linktr.ee/profiles/_next/static/media/video-frame-mobile.6702572a1865582b.webp"); }
  }

  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .bg-video.mobile { display: none; }
  @media (max-width: 600px) {
    .bg-video.desktop { display: none; }
    .bg-video.mobile { display: block; }
  }

  .wrap {
    width: 100%;
    max-width: 600px;
    padding: clamp(40px, 8vw, 56px) 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 0 auto;
  }

  .avatar-wrap {
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    will-change: transform, opacity;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    background: #111;
    animation: floatY 4.8s ease-in-out 1.1s infinite;
    will-change: transform;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-7px) scale(1.025); }
  }

  h1.title {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.35rem, 6vw, 1.6rem);
    line-height: 1.2;
    text-align: center;
    margin-top: 16px;
    color: #fff;
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.12s backwards;
    will-change: transform, opacity;
  }

  /* ---- Accordion ---- */
  .acc {
    width: 100%;
    max-width: 600px;
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .acc-item {
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    will-change: transform, opacity;
  }
  .acc-item:nth-child(1) { animation-delay: 0.26s; }
  .acc-item:nth-child(2) { animation-delay: 0.34s; }
  .acc-item:nth-child(3) { animation-delay: 0.42s; }

  .btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    width: 100%;
    min-height: 64px;
    padding: 12px clamp(58px, 14vw, 60px);
    border-radius: 28px;
    border: 1px solid #FFFFFF;
    background: transparent;
    color: #FFFFFF;
    text-decoration: none;
    text-align: center;
    font-family: inherit;
    cursor: pointer;
    transition: background-color .25s ease, transform .4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .25s ease, border-color .25s ease;
    will-change: transform;
  }
  .btn:hover {
    background: rgba(255,255,255,0.07);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.95);
  }
  .txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; gap: 1px; }
  .t1 { font-weight: 500; font-size: clamp(14px, 4vw, 16px); }

  .chevron {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    opacity: 0.85;
    transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .acc-toggle[aria-expanded="true"] .chevron { transform: translateY(-50%) rotate(180deg); }

  /* Smooth expand/collapse via grid-template-rows 0fr -> 1fr */
  .panel {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin-top: 0;
    transition: grid-template-rows .45s cubic-bezier(0.16, 1, 0.3, 1), opacity .35s ease, margin-top .35s ease;
  }
  .acc-item.open .panel {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 8px;
  }
  .panel-inner {
    overflow: hidden;
    min-height: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 18px;
    padding: 6px 16px;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  /* Info rows (server addresses) */
  .row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 0;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .row:first-child { border-top: none; }
  .label {
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .value {
    font-size: 15px;
    color: #fff;
    word-break: break-all;
    line-height: 1.35;
  }
  .copy-line { display: flex; align-items: center; gap: 8px; }
  .copy-btn {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    cursor: pointer;
    padding: 0;
    transition: background-color .2s ease, border-color .2s ease, color .2s ease;
  }
  .copy-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.9);
  }
  .copy-btn.copied { color: #7CFFB0; border-color: #7CFFB0; }
  .copy-btn svg { width: 15px; height: 15px; display: block; }

  /* Link rows rendered as buttons (label only, URL hidden) */
  .panel-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    margin: 8px 0;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.05);
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: background-color .25s ease, transform .3s cubic-bezier(0.16, 1, 0.3, 1), border-color .25s ease;
  }
  .panel-btn:hover {
    background: rgba(255,255,255,0.13);
    border-color: rgba(255,255,255,0.95);
    transform: translateY(-1px);
  }
  .pb-label { font-weight: 600; }

  footer {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 22px 0 28px;
    flex-shrink: 0;
  }
  footer img { height: 22px; width: auto; opacity: 0.9; }
  .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .credit { font-size: 12px; color: rgba(255,255,255,0.5); text-align: center; letter-spacing: 0.2px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  footer { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s backwards; }

  @media (max-width: 380px) {
    .acc-item .panel-inner { padding: 6px 12px; }
    .value { font-size: 14px; }
  }
  @media (min-width: 768px) {
    .wrap { padding-top: 72px; }
    .acc { margin-top: 32px; }
  }
  @media (min-width: 1024px) {
    .wrap { padding-top: 88px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap, .avatar, h1.title, .acc-item, footer { animation: none; }
    .panel { transition: none; }
  }
</style>

  <script>
    document.querySelectorAll('.acc-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var item = btn.closest('.acc-item');
        var isOpen = item.classList.contains('open');
        document.querySelectorAll('.acc-item').forEach(function (it) {
          it.classList.remove('open');
          it.querySelector('.acc-toggle').setAttribute('aria-expanded', 'false');
        });
        if (!isOpen) {
          item.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject();
        } catch (err) { reject(err); }
      });
    }

    document.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        copyText(btn.getAttribute('data-copy')).then(function () {
          var prev = btn.innerHTML;
          btn.innerHTML = '&#10003;';
          btn.classList.add('copied');
          setTimeout(function () { btn.innerHTML = prev; btn.classList.remove('copied'); }, 1200);
        }).catch(function () {});
      });
    });

    document.addEventListener('contextmenu', function (e) { if (!e.target.closest('.panel-btn') && !e.target.closest('.copy-btn')) e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('copy', function (e) { e.preventDefault(); });
    document.addEventListener('cut', function (e) { e.preventDefault(); });
  </script>
