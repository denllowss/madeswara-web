<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
  img { -webkit-user-drag: none; user-drag: none; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", Helvetica, Arial, system-ui, -apple-system, sans-serif;
    color: #fff;
    background-color: #000;
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  /* Webp fallback (direct from CDN) sits behind the video */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("https://assets.production.linktr.ee/profiles/_next/static/media/video-frame-desktop.f2c8f96488cada9c.webp");
    background-size: cover;
    background-position: center;
    z-index: -3;
  }
  /* Dark overlay for readability */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 100%);
    z-index: -1;
  }
  @media (max-width: 600px) {
    body::before { background-image: url("https://assets.production.linktr.ee/profiles/_next/static/media/video-frame-mobile.6702572a1865582b.webp"); }
  }

  /* Background video (direct from CDN, format .mp4) */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .bg-video.mobile { display: none; }
  @media (max-width: 600px) {
    .bg-video.desktop { display: none; }
    .bg-video.mobile { display: block; }
  }

  .wrap {
    width: 100%;
    max-width: 600px;
    padding: clamp(40px, 8vw, 56px) 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 0 auto;
  }

  .avatar-wrap {
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    will-change: transform, opacity;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    background: #111;
    animation: floatY 4.8s ease-in-out 1.1s infinite;
    will-change: transform;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-7px) scale(1.025); }
  }

  h1.title {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-weight: 400;
    font-size: clamp(1.35rem, 6vw, 1.6rem);
    line-height: 1.2;
    text-align: center;
    margin-top: 16px;
    color: #fff;
    animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.12s backwards;
    will-change: transform, opacity;
  }

  .links {
    width: 100%;
    max-width: 600px;
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- Link button: faithful to Linktree's real markup ---- */
  .btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    width: 100%;
    min-height: 64px;
    padding: 12px clamp(58px, 14vw, 60px);
    border-radius: 28px;
    border: 1px solid #FFFFFF;
    background: transparent;
    color: #FFFFFF;
    text-decoration: none;
    text-align: center;
    transition: background-color .25s ease, transform .4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .25s ease, border-color .25s ease;
    will-change: transform;
  }
  .btn:hover {
    background: rgba(255,255,255,0.07);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.95);
  }

  .thumb {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 20px;
    object-fit: cover;
    flex-shrink: 0;
    background: #222;
  }

  .icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(255,255,255,0.10);
    color: #fff;
  }

  .txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; gap: 1px; }
  .t1 { font-weight: 500; font-size: clamp(14px, 4vw, 16px); }
  .t2 { font-weight: 400; font-size: 12px; opacity: 0.6; margin-top: 1px; }

  /* Share button (top-right of each link) */
  .share-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    background: transparent;
    color: #fff;
    opacity: 0.5;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color .2s ease, opacity .2s ease;
  }
  .share-btn:hover {
    background: rgba(0,0,0,0.25);
    opacity: 1;
  }
  .share-btn svg { width: 16px; height: 16px; display: block; }

  footer {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 22px 0 28px;
    flex-shrink: 0;
  }
  footer img { height: 22px; width: auto; opacity: 0.9; }
  .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .credit { font-size: 12px; color: rgba(255,255,255,0.5); text-align: center; letter-spacing: 0.2px; }

  /* Entrance animation — extra smooth & seamless */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .links .btn { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  .links .btn:nth-child(1) { animation-delay: 0.26s; }
  .links .btn:nth-child(2) { animation-delay: 0.34s; }
  .links .btn:nth-child(3) { animation-delay: 0.42s; }
  .links .btn:nth-child(4) { animation-delay: 0.50s; }
  .links .btn:nth-child(5) { animation-delay: 0.58s; }
  footer { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.72s backwards; }

  /* ---- Responsive: small phones ---- */
  @media (max-width: 380px) {
    .links { gap: 12px; }
    .btn { padding: 11px 56px; min-height: 60px; }
    .t2 { font-size: 11px; }
    .thumb, .icon { width: 44px; height: 44px; border-radius: 18px; }
    .icon { border-radius: 50%; }
    .share-btn { right: 8px; }
  }
  /* ---- Responsive: tablets & large desktops ---- */
  @media (min-width: 768px) {
    .wrap { padding-top: 72px; }
    .links { margin-top: 32px; }
  }
  @media (min-width: 1024px) {
    .wrap { padding-top: 88px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap, .avatar, h1.title, .links .btn, footer { animation: none; }
  }
</style>

  <script>
    document.querySelectorAll('.share-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var a = btn.closest('a');
        var url = a ? a.href : location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () {
            var prev = btn.innerHTML;
            btn.style.opacity = '1';
            btn.innerHTML = '&#10003;';
            setTimeout(function () { btn.innerHTML = prev; }, 1200);
          }).catch(function () {});
        }
      });
